name: Run gradle build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
    - name: Assemble the project
      run: ./gradlew assemble
    - name: Run the tests
      run: ./gradlew test