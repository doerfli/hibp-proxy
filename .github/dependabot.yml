version: 2
updates:
  # Gradle dependencies (build.gradle)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      gradle-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      gradle-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # Docker base image (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
